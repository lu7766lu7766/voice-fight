<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#1b1226">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>聲控對戰</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@500;700;900&family=Noto+Serif+TC:wght@700;900&display=swap">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="phone">
  <div id="app">
    <!-- 輸入房號 -->
    <section id="join" class="screen">
      <div class="join-box">
        <h1 class="logo">聲控<span>對戰</span></h1>
        <p class="sub">念出招式・消除方塊・擊敗對手</p>
        <form id="joinForm">
          <input id="roomInput" inputmode="numeric" pattern="[0-9]*" maxlength="4" placeholder="房間號碼" autocomplete="off">
          <button type="submit" class="btn gold">進入房間</button>
        </form>
        <p id="joinMsg" class="msg"></p>
      </div>
    </section>

    <!-- 選角 -->
    <section id="lobby" class="screen">
      <header class="lobby-head">
        <div>房間 <b id="lbRoom">----</b></div>
        <div id="lbSide" class="side-tag"></div>
      </header>
      <div id="opponent" class="opp"></div>
      <div class="lobby-body">
        <div id="charGrid" class="char-grid"></div>
        <div id="charDetail" class="char-detail"></div>
      </div>
      <footer class="lobby-foot">
        <button id="readyBtn" class="btn gold big" disabled>請先選擇角色</button>
      </footer>
    </section>

    <!-- 對戰 -->
    <section id="battle" class="screen">
      <div id="stage">
        <canvas id="scene"></canvas>
        <div class="hud">
          <div class="hud-side" id="hud0"></div>
          <div class="hud-side right" id="hud1"></div>
        </div>
        <div id="countdown"></div>
      </div>
      <div id="speechBar"><span id="speechText"></span></div>
      <div id="boardWrap">
        <div id="board"></div>
        <div id="boardCover"><span>準備中…</span></div>
      </div>
      <div id="controls">
        <button id="movesBtn" class="ctrl">
          <b>📜</b><small>招式表</small>
        </button>
        <button id="micBtn" class="ctrl mic">
          <b>🎤</b><small id="micLabel">集氣中…</small>
          <i id="micRing"></i>
          <i id="micLevel"></i>
        </button>
        <button id="atkBtn" class="ctrl">
          <b>⚔️</b><small>普攻</small>
          <i id="atkCd"></i>
        </button>
      </div>
    </section>
  </div>

  <!-- 招式表 -->
  <div id="movesModal" class="modal hidden">
    <div class="sheet">
      <header><h2>我的招式</h2><button class="close" data-close>✕</button></header>
      <p class="hint">在方塊中找出<b id="adjHint">上下左右相連（可以轉彎）</b>的招式名稱，集氣滿時對著麥克風念出來！<br>✓ 表示目前盤面上找得到。</p>
      <ul id="movesList" class="moves-list"></ul>
      <div id="statsBox" class="stats-box"></div>
      <div class="extra">
        <p>找不到招式？念「<b>重置</b>」重新洗牌（每場 1 次，剩 <b id="resetLeft">1</b> 次）</p>
        <label class="switch"><input type="checkbox" id="denoiseToggle" checked> 收音降噪（環境吵雜時建議開啟）</label>
        <p id="denoiseNote" class="note"></p>
        <label class="switch"><input type="checkbox" id="tapToggle"> 手動點選方塊出招（無法使用麥克風時）</label>
        <button id="tapResetBtn" class="btn small hidden">重置盤面</button>
      </div>
    </div>
  </div>

  <!-- 結果 -->
  <div id="resultModal" class="modal hidden">
    <div class="result-box">
      <h2 id="resultTitle">勝利</h2>
      <p id="resultSub"></p>
      <button id="rematchBtn" class="btn gold big">再來一局</button>
    </div>
  </div>

  <div id="toast"></div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/shared/characters.js"></script>
  <script src="/js/sprites.js"></script>
  <script src="/js/scene.js"></script>
  <script src="/js/boardview.js"></script>
  <script src="/js/voice.js"></script>
  <script src="/js/play.js"></script>
</body>
</html>
